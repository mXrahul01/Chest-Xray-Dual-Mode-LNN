<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk X-ray Analysis</title>
    <!-- Bootstrap & FontAwesome -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #232946 0%, #0a192f 100%);
            font-family: 'Segoe UI', sans-serif;
            color: #ccd6f6;
            transition: background 0.5s ease;
        }
        .navbar {
            background-color: #112240;
            padding: 10px 20px;
            box-shadow: 0 2px 16px rgba(0,0,10,0.45);
            border-radius: 0 0 14px 14px;
            animation: slideDown 1s;
        }
        .navbar img {
            width: 75px;
            filter: drop-shadow(0 4px 6px #0a192f66);
            border-radius: 50%;
            border: 2px solid #00bcd4;
            transition: transform 0.3s;
        }
        .navbar img:hover { transform: scale(1.05) rotate(-2deg); }

        .container {
            margin-top: 60px;
            min-height: 70vh;
            animation: fadeInUp 1s;
        }

        .card {
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 16px 0 #0005, 0 1.5px 4px 0 #00bcd455;
            background: rgba(17,34,64,0.96);
            border: 1.5px solid #305081;
            transition: box-shadow 0.3s;
        }

        .card:hover {
            box-shadow: 0 6px 24px rgba(0,188,212,0.15);
        }

        h1 {
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 1px 2px 4px #00bcd4aa;
        }

        .subtitle {
            font-size: 1rem;
            color: #7f98b6;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2.5px dashed #298ca9;
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            background: rgba(22,32,61,0.92);
            position: relative;
        }
        .upload-area:hover {
            background: #1f4068cc;
            border-color: #00bcd4;
        }
        .upload-icon {
            font-size: 2.8rem;
            color: #00bcd4;
            margin-bottom: 15px;
            transition: color 0.3s;
            animation: floatIcon 1.5s infinite alternate;
        }
        .upload-area:hover .upload-icon {
            color: #0097a7;
        }
        .upload-instructions {
            font-size: 1.05rem;
            color: #7f98b6;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .file-input { display: none; }
        .selected-folder {
            display: none;
            margin-top: 15px;
            background: #182c47;
            border-radius: 8px;
            padding: 10px;
            color: #00bcd4;
            font-weight: bold;
            box-shadow: 0 2px 6px #00bcd455;
        }
        .btn-custom {
            background: linear-gradient(90deg, #00bcd4 30%, #0097a7 90%);
            color: #0a192f;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 28px;
            box-shadow: 0 0 5px #00bcd4cc;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: scale(1.06);
            background: linear-gradient(90deg, #0097a7 30%, #00bcd4 90%);
            box-shadow: 0 0 10px #00bcd499;
        }

        /* Animations */
        @keyframes fadeInUp { 0%{opacity:0;transform:translateY(40px);}100%{opacity:1;transform:translateY(0);} }
        @keyframes slideDown { 0%{opacity:0;transform:translateY(-50px);}100%{opacity:1;transform:translateY(0);} }
        @keyframes floatIcon { 0%{transform:translateY(0);}100%{transform:translateY(-8px);} }
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="/">
        <img src="https://user-gen-media-assets.s3.amazonaws.com/seedream_images/4c4afc19-b52b-4a44-86e9-abd1c281937e.png" alt="Logo">
    </a>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center">
                <h1>Upload X-ray Folder</h1>
                <p class="subtitle">
                    Upload up to <strong>1000 chest X-rays</strong>. Our AI will analyze all images using dual-model comparison and generate a detailed CSV report.
                </p>

                <form action="/upload_bulk" method="post" enctype="multipart/form-data" id="upload-form">
                    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                        <div class="upload-icon"><i class="fas fa-folder-open"></i></div>
                        <div class="upload-instructions">
                            Click or drag your folder containing multiple X-rays (PNG, JPG, JPEG)
                        </div>
                    </div>

                    <input type="file" id="file-input" name="folder" class="file-input" accept=".png, .jpg, .jpeg" webkitdirectory multiple required>

                    <div id="selected-folder" class="selected-folder">
                        <i class="fas fa-folder"></i> <span id="folder-name"></span>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-custom btn-lg shadow-none">
                            <i class="fas fa-upload"></i> Upload & Analyze
                        </button>
                    </div>
                </form>

                <p style="margin-top:25px; color:#7f98b6; font-size:0.9rem;">
                    <i class="fas fa-info-circle"></i> Analysis includes pneumonia and lung opacity detection with confidence scores.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const folderInfo = document.getElementById('folder-name');
    const selectedFolder = document.getElementById('selected-folder');
    const uploadForm = document.getElementById('upload-form');

    // Display folder details
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            const total = fileInput.files.length;
            folderInfo.textContent = `${total} file(s) selected`;
            selectedFolder.style.display = 'block';

            if (total > 1000) {
                alert('⚠️ Too many images! Please upload a maximum of 1000.');
                fileInput.value = '';
                selectedFolder.style.display = 'none';
            }
        }
    });

    // Prevent empty submission
    uploadForm.addEventListener('submit', (e) => {
        if (fileInput.files.length === 0) {
            e.preventDefault();
            alert('Please select at least one image before submitting.');
        }
    });

    // Drag-and-drop behavior
    const uploadArea = document.getElementById('upload-area');
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.background = '#1f4068ee';
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.background = 'rgba(22,32,61,0.92)';
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        const dropped = e.dataTransfer.files;
        fileInput.files = dropped;
        if (dropped.length > 0) {
            folderInfo.textContent = `${dropped.length} file(s) selected`;
            selectedFolder.style.display = 'block';
        }
    });
</script>
</body>
</html>
